        Today, Mom sent me a photo modified by ChatGPT, with a Pikachu on my shoulder. The original photo came from a museum of optical illusions in Kraków, specifically from a room designed to look like a white-and-black cartoon or comic.

        Admittedly silly, but normally I don't like generative AI.
    
        Later she showed me a photo of me high-fiving a large Pikachu at Aladzha Monastery in Bulgaria. The Pikachu's face seems to be around the height of my waist. You don't need to be a genius to infer what made this photo.
        
        Mom apparently became a little obsessed after generating visualizations of my room after renovations.
