<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.png"/>
    <title>cezram.xyz Microblog</title>
</head>
<body>
    {%- capture microblog -%}
    {% render 'microblog.json' %}
    {%- endcapture -%}
    {%- assign entries = microblog | jsonparse -%}
    <dl>
        {%- for entry in entries -%}
        <dt><time datetime="{{ entry.date }}">{{ entry.date | toDateObject | fmtFullDate }}</time></dt>
        <dd>{{ entry.text }}</dd>
        {%- endfor -%}
    </dl>
</body>
</html>
